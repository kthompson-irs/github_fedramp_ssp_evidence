name: Enterprise User Activity Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  enterprise-activity:
    runs-on: ubuntu-latest
    env:
      ENTERPRISE: your-enterprise-name
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install requests pandas
      - run: mkdir -p reports
      - name: Collect Enterprise Activity
        env:
          GH_TOKEN: ${{ secrets.FEDRAMP_ENTERPRISE_TOKEN }}
        run: python scripts/enterprise_user_activity.py
      - uses: actions/upload-artifact@v4
        with:
          name: enterprise-user-activity
          path: reports/
