name: Enterprise User Activity Report

on:
  workflow_dispatch:

  schedule:
    # Every day at 02:00 UTC
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  enterprise-activity:

    runs-on: ubuntu-latest

    env:
      ENTERPRISE: your-enterprise-name

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Create Output Folder
        run: mkdir -p reports

      - name: Collect Enterprise Activity
        env:
          GH_TOKEN: ${{ secrets.FEDRAMP_ENTERPRISE_TOKEN }}
        run: |
          python scripts/enterprise_user_activity.py

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-user-activity
          path: reports/
