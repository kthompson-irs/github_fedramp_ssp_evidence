name: Collect IA-05(01) Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN_FOR_AUDIT: ${{ secrets.IA0501_GITHUB_TOKEN }}
      ENTERPRISE_SLUG: internal-revenue-service
      OUTPUT_DIR: evidence/IA-05-01

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect IA-05(01) evidence
        run: |
          python scripts/collect_ia_05_01.py

      - name: Upload IA-05(01) evidence
        uses: actions/upload-artifact@v4
        with:
          name: IA-05-01-evidence
          path: evidence/IA-05-01/
          retention-days: 90
