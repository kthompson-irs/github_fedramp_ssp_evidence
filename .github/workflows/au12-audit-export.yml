name: AU-12 Enterprise Audit Export

on:
  schedule:
    - cron: '15 2 * * *'

  workflow_dispatch:
    inputs:
      org_scope:
        description: 'Comma-separated organization list or ALL'
        required: false
        default: 'ALL'

      lookback_days:
        description: 'Number of days to export'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: au12-audit-export
  cancel-in-progress: false

jobs:
  export-audit-logs:
    runs-on: self-hosted

    env:
      ENTERPRISE_SLUG: internal-revenue-service
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '1' }}
      ORG_SCOPE: ${{ github.event.inputs.org_scope || 'ALL' }}

      # Air-gapped GitHub Enterprise Server values
      # Example:
      # GH_HOST=github.irs.local
      # GH_API_BASE_URL=https://github.irs.local/api/v3
      GH_HOST: ${{ secrets.GH_HOST }}
      GH_API_BASE_URL: ${{ secrets.GH_API_BASE_URL }}

      AU12_AUDIT_TOKEN: ${{ secrets.AU12_AUDIT_TOKEN }}
      AU12_ARCHIVE_DIR: ${{ secrets.AU12_ARCHIVE_DIR }}

    steps:
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_HOST:-}" ]; then
            echo "ERROR: GH_HOST is empty."
            echo "Set GH_HOST to the internal GitHub Enterprise Server hostname."
            exit 1
          fi

          if [ -z "${GH_API_BASE_URL:-}" ]; then
            echo "ERROR: GH_API_BASE_URL is empty."
            echo "Set GH_API_BASE_URL to https://${GH_HOST}/api/v3"
            exit 1
          fi

          if [ -z "${AU12_AUDIT_TOKEN:-}" ]; then
            echo "ERROR: AU12_AUDIT_TOKEN is empty."
            exit 1
          fi

          if printf '%s' "${AU12_AUDIT_TOKEN}" | LC_ALL=C grep -q '[[:space:][:cntrl:]]'; then
            echo "ERROR: AU12_AUDIT_TOKEN contains whitespace, a line break, or a control character."
            exit 1
          fi

          echo "GH_HOST=${GH_HOST}"
          echo "GH_API_BASE_URL=${GH_API_BASE_URL}"

      - name: Validate internal DNS and API reachability
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking DNS for ${GH_HOST}..."
          getent hosts "${GH_HOST}"

          echo "Checking GitHub Enterprise API metadata endpoint..."
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --header "Authorization: Bearer ${AU12_AUDIT_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GH_API_BASE_URL}/meta" \
            >/dev/null

          echo "Internal GitHub API is reachable."

      - name: Validate GitHub authentication
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating authenticated user..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --header "Authorization: Bearer ${AU12_AUDIT_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GH_API_BASE_URL}/user" \
            >/dev/null

          echo "Validating enterprise access..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --header "Authorization: Bearer ${AU12_AUDIT_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GH_API_BASE_URL}/enterprises/${ENTERPRISE_SLUG}" \
            >/dev/null

          echo "Enterprise access verified."

      - name: Prepare output directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out/raw
          mkdir -p out/normalized
          mkdir -p out/summaries

      - name: Resolve organization list
        id: orgs
        shell: bash
        run: |
          set -euo pipefail

          if [ "${ORG_SCOPE}" = "ALL" ]; then
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --header "Authorization: Bearer ${AU12_AUDIT_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "${GH_API_BASE_URL}/enterprises/${ENTERPRISE_SLUG}/orgs?per_page=100" \
              > out/summaries/orgs.json

            ORG_LIST="$(python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("out/summaries/orgs.json").read_text())
          print(",".join(item["login"] for item in data))
          PY
          )"
          else
            ORG_LIST="${ORG_SCOPE}"
          fi

          if [ -z "${ORG_LIST}" ]; then
            echo "ERROR: No organizations resolved."
            exit 1
          fi

          echo "Organizations to export: ${ORG_LIST}"
          echo "org_list=${ORG_LIST}" >> "$GITHUB_OUTPUT"

      - name: Export enterprise audit log
        shell: bash
        run: |
          set -euo pipefail

          SINCE="$(date -u -d "${LOOKBACK_DAYS} days ago" +%F)"
          UNTIL="$(date -u +%F)"

          OUTFILE="out/raw/enterprise-${ENTERPRISE_SLUG}-${SINCE}-to-${UNTIL}.json"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --header "Authorization: Bearer ${AU12_AUDIT_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${GH_API_BASE_URL}/enterprises/${ENTERPRISE_SLUG}/audit-log?include=all&per_page=100&phrase=created:${SINCE}..${UNTIL}" \
            > "${OUTFILE}"

      - name: Export organization audit logs
        shell: bash
        run: |
          set -euo pipefail

          SINCE="$(date -u -d "${LOOKBACK_DAYS} days ago" +%F)"
          UNTIL="$(date -u +%F)"

          IFS=',' read -ra ORGS <<< "${{ steps.orgs.outputs.org_list }}"

          for ORG in "${ORGS[@]}"; do
            ORG_TRIMMED="$(echo "$ORG" | xargs)"
            [ -z "$ORG_TRIMMED" ] && continue

            OUTFILE="out/raw/org-${ORG_TRIMMED}-${SINCE}-to-${UNTIL}.json"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --header "Authorization: Bearer ${AU12_AUDIT_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "${GH_API_BASE_URL}/orgs/${ORG_TRIMMED}/audit-log?include=all&per_page=100&phrase=created:${SINCE}..${UNTIL}" \
              > "${OUTFILE}"
          done

      - name: Normalize audit data
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import csv
          import glob
          import json
          from pathlib import Path

          raw_files = sorted(glob.glob("out/raw/*.json"))
          summary_path = Path("out/summaries/au12-summary.csv")
          detail_path = Path("out/normalized/au12-normalized.jsonl")

          rows = []

          with detail_path.open("w", encoding="utf-8") as detail:
              for file in raw_files:
                  source = Path(file).stem

                  try:
                      data = json.loads(Path(file).read_text(encoding="utf-8"))
                  except Exception:
                      data = []

                  if isinstance(data, dict):
                      data = [data]

                  for item in data:
                      item["_source_file"] = source
                      detail.write(json.dumps(item, sort_keys=True) + "\n")

                      rows.append({
                          "source_file": source,
                          "action": item.get("action", ""),
                          "actor": item.get("actor", ""),
                          "org": item.get("org", ""),
                          "repo": item.get("repo", ""),
                          "created_at": item.get("created_at", ""),
                          "operation_type": item.get("operation_type", ""),
                          "actor_ip": item.get("actor_ip", ""),
                      })

          summary_path.parent.mkdir(parents=True, exist_ok=True)

          with summary_path.open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=[
                      "source_file",
                      "action",
                      "actor",
                      "org",
                      "repo",
                      "created_at",
                      "operation_type",
                      "actor_ip",
                  ],
              )
              writer.writeheader()
              writer.writerows(rows)

          print("Normalization complete.")
          PY

      - name: Compute checksums
        shell: bash
        run: |
          set -euo pipefail

          (
            cd out
            find . -type f | sort | xargs sha256sum
          ) > out/summaries/sha256sums.txt

      - name: Archive AU-12 evidence locally
        shell: bash
        run: |
          set -euo pipefail

          RUN_STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          ARCHIVE_DIR="${AU12_ARCHIVE_DIR:-/var/log/github-au12-audit}"

          mkdir -p "${ARCHIVE_DIR}/${RUN_STAMP}"

          cp -R out/* "${ARCHIVE_DIR}/${RUN_STAMP}/"

          tar -czf "${ARCHIVE_DIR}/au12-audit-${RUN_STAMP}.tar.gz" -C out .

          sha256sum "${ARCHIVE_DIR}/au12-audit-${RUN_STAMP}.tar.gz" \
            > "${ARCHIVE_DIR}/au12-audit-${RUN_STAMP}.tar.gz.sha256"

          echo "Archived AU-12 evidence to ${ARCHIVE_DIR}/${RUN_STAMP}"
