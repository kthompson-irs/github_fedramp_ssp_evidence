name: AU-12 Enterprise Audit Export

on:
  schedule:
    - cron: '15 2 * * *'

  workflow_dispatch:
    inputs:
      org_scope:
        description: 'Comma-separated organization list or ALL'
        required: false
        default: 'ALL'

      lookback_days:
        description: 'Number of days to export'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: au12-audit-export
  cancel-in-progress: false

jobs:
  export-audit-logs:
    runs-on: ubuntu-latest

    env:
      ENTERPRISE_SLUG: internal-revenue-service
      GH_API_BASE_URL: https://api.github.com
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '1' }}
      ORG_SCOPE: ${{ github.event.inputs.org_scope || 'ALL' }}
      AU12_AUDIT_TOKEN: ${{ secrets.AU12_AUDIT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Validate GitHub token
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${AU12_AUDIT_TOKEN:-}" ]; then
            echo "ERROR: AU12_AUDIT_TOKEN is empty."
            exit 1
          fi

          if printf '%s' "${AU12_AUDIT_TOKEN}" | LC_ALL=C grep -q '[[:space:][:cntrl:]]'; then
            echo "ERROR: AU12_AUDIT_TOKEN contains whitespace, line breaks, or control characters."
            echo "Recreate the secret using only the raw PAT value."
            exit 1
          fi

          echo "Validating GitHub.com authentication..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --header "Authorization: Bearer ${AU12_AUDIT_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GH_API_BASE_URL}/user" \
            >/dev/null

          echo "Validating enterprise access..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --header "Authorization: Bearer ${AU12_AUDIT_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GH_API_BASE_URL}/enterprises/${ENTERPRISE_SLUG}" \
            >/dev/null

          echo "Enterprise access verified."

      - name: Prepare output directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/raw out/normalized out/summaries

      - name: Resolve organization list
        id: orgs
        shell: bash
        run: |
          set -euo pipefail

          if [ "${ORG_SCOPE}" = "ALL" ]; then
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --header "Authorization: Bearer ${AU12_AUDIT_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GH_API_BASE_URL}/enterprises/${ENTERPRISE_SLUG}/orgs?per_page=100" \
              > out/summaries/orgs.json

            ORG_LIST="$(jq -r '.[].login' out/summaries/orgs.json | paste -sd, -)"
          else
            ORG_LIST="${ORG_SCOPE}"
          fi

          if [ -z "${ORG_LIST}" ]; then
            echo "ERROR: No organizations resolved."
            exit 1
          fi

          echo "Organizations to export: ${ORG_LIST}"
          echo "org_list=${ORG_LIST}" >> "$GITHUB_OUTPUT"

      - name: Export enterprise audit log
        shell: bash
        run: |
          set -euo pipefail

          SINCE="$(date -u -d "${LOOKBACK_DAYS} days ago" +%F)"
          UNTIL="$(date -u +%F)"
          OUTFILE="out/raw/enterprise-${ENTERPRISE_SLUG}-${SINCE}-to-${UNTIL}.json"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --header "Authorization: Bearer ${AU12_AUDIT_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GH_API_BASE_URL}/enterprises/${ENTERPRISE_SLUG}/audit-log?include=all&per_page=100&phrase=created:${SINCE}..${UNTIL}" \
            > "${OUTFILE}"

      - name: Export organization audit logs
        shell: bash
        run: |
          set -euo pipefail

          SINCE="$(date -u -d "${LOOKBACK_DAYS} days ago" +%F)"
          UNTIL="$(date -u +%F)"

          IFS=',' read -ra ORGS <<< "${{ steps.orgs.outputs.org_list }}"

          for ORG in "${ORGS[@]}"; do
            ORG_TRIMMED="$(echo "$ORG" | xargs)"
            [ -z "$ORG_TRIMMED" ] && continue

            OUTFILE="out/raw/org-${ORG_TRIMMED}-${SINCE}-to-${UNTIL}.json"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --header "Authorization: Bearer ${AU12_AUDIT_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GH_API_BASE_URL}/orgs/${ORG_TRIMMED}/audit-log?include=all&per_page=100&phrase=created:${SINCE}..${UNTIL}" \
              > "${OUTFILE}"
          done

      - name: Normalize audit data
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import csv
          import glob
          import json
          from pathlib import Path

          raw_files = sorted(glob.glob("out/raw/*.json"))
          summary_path = Path("out/summaries/au12-summary.csv")
          detail_path = Path("out/normalized/au12-normalized.jsonl")

          rows = []

          with detail_path.open("w", encoding="utf-8") as detail:
              for file in raw_files:
                  source = Path(file).stem

                  try:
                      data = json.loads(Path(file).read_text(encoding="utf-8"))
                  except Exception:
                      data = []

                  if isinstance(data, dict):
                      data = [data]

                  for item in data:
                      item["_source_file"] = source
                      detail.write(json.dumps(item, sort_keys=True) + "\n")

                      rows.append({
                          "source_file": source,
                          "action": item.get("action", ""),
                          "actor": item.get("actor", ""),
                          "org": item.get("org", ""),
                          "repo": item.get("repo", ""),
                          "created_at": item.get("created_at", ""),
                          "operation_type": item.get("operation_type", ""),
                          "actor_ip": item.get("actor_ip", ""),
                      })

          summary_path.parent.mkdir(parents=True, exist_ok=True)

          with summary_path.open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=[
                      "source_file",
                      "action",
                      "actor",
                      "org",
                      "repo",
                      "created_at",
                      "operation_type",
                      "actor_ip",
                  ],
              )
              writer.writeheader()
              writer.writerows(rows)

          print("Normalization complete.")
          PY

      - name: Compute checksums
        shell: bash
        run: |
          set -euo pipefail

          (
            cd out
            find . -type f | sort | xargs sha256sum
          ) > out/summaries/sha256sums.txt

      - name: Upload AU-12 audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: au12-audit-exports
          path: out/
          retention-days: 90
