name: AU-12 Enterprise Audit Export

on:
  schedule:
    - cron: '15 2 * * *'

  workflow_dispatch:
    inputs:
      org_scope:
        description: 'Comma-separated organization list or ALL'
        required: false
        default: 'ALL'

      lookback_days:
        description: 'Number of days to export'
        required: false
        default: '1'

      gh_host:
        description: 'GitHub host for this enterprise, such as github.com or the enterprise GHE.com subdomain'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: au12-audit-export
  cancel-in-progress: false

jobs:
  export-audit-logs:
    runs-on: ubuntu-latest

    env:
      ENTERPRISE_SLUG: internal-revenue-service
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '1' }}
      ORG_SCOPE: ${{ github.event.inputs.org_scope || 'ALL' }}

      # REQUIRED SECRET: PAT Classic with audit-log access and the right enterprise permissions
      GH_TOKEN: ${{ secrets.AU12_AUDIT_TOKEN }}

      # Optional secret override. If empty, the workflow_dispatch input is used.
      GH_HOST_SECRET: ${{ secrets.GH_HOST }}

      # OPTIONAL
      AUDIT_ARCHIVE_REPO: ${{ secrets.AU12_ARCHIVE_REPO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq

      ######################################################################
      # RESOLVE HOST
      ######################################################################

      - name: Resolve GitHub host
        id: host
        shell: bash
        run: |
          set -euo pipefail

          INPUT_HOST="${{ github.event.inputs.gh_host || '' }}"
          SECRET_HOST="${GH_HOST_SECRET:-}"

          if [ -n "$SECRET_HOST" ]; then
            GH_HOST="$SECRET_HOST"
          elif [ -n "$INPUT_HOST" ]; then
            GH_HOST="$INPUT_HOST"
          else
            echo "ERROR: GH_HOST is not set."
            echo "Set the GH_HOST secret or pass gh_host in workflow_dispatch."
            exit 1
          fi

          echo "Resolved GH_HOST=${GH_HOST}"
          echo "gh_host=${GH_HOST}" >> "$GITHUB_OUTPUT"

      ######################################################################
      # VALIDATE TOKEN AND HOST
      ######################################################################

      - name: Validate GitHub authentication
        shell: bash
        env:
          GH_HOST: ${{ steps.host.outputs.gh_host }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "ERROR: GH_TOKEN is empty."
            echo "Configure repository secret: AU12_AUDIT_TOKEN"
            exit 1
          fi

          echo "Validating GitHub authentication against ${GH_HOST}..."

          if ! gh auth status --hostname "${GH_HOST}"; then
            echo "ERROR: GitHub authentication failed."
            echo "Possible causes:"
            echo " - invalid PAT"
            echo " - expired PAT"
            echo " - PAT Classic required"
            echo " - missing read:audit_log scope"
            echo " - SSO authorization missing"
            echo " - insufficient enterprise permissions"
            echo " - incorrect GH_HOST value for your cloud"
            exit 1
          fi

          echo "Authentication validated."

          echo "Testing authenticated user endpoint..."
          if ! gh api --hostname "${GH_HOST}" /user >/dev/null; then
            echo "ERROR: Token authenticated, but /user request failed."
            exit 1
          fi

          echo "Testing enterprise access..."
          if ! gh api --hostname "${GH_HOST}" "/enterprises/${ENTERPRISE_SLUG}" >/dev/null; then
            echo "ERROR: Token authenticated, but enterprise access failed."
            echo "Verify that the token owner is an Enterprise Owner or has audit-log admin access."
            echo "Also verify the token is SSO-authorized for the enterprise."
            exit 1
          fi

          echo "Enterprise access verified."

      ######################################################################
      # PREPARE OUTPUT
      ######################################################################

      - name: Prepare output directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/raw
          mkdir -p out/normalized
          mkdir -p out/summaries

      ######################################################################
      # RESOLVE ORGANIZATION LIST
      ######################################################################

      - name: Resolve organization list
        id: orgs
        shell: bash
        run: |
          set -euo pipefail

          if [ "${ORG_SCOPE}" = "ALL" ]; then
            # Replace with the actual authoritative enterprise organization inventory.
            ORG_LIST="platform,applications,security,data,operations,sandbox"
          else
            ORG_LIST="${ORG_SCOPE}"
          fi

          echo "Organizations to export: ${ORG_LIST}"
          echo "org_list=${ORG_LIST}" >> "$GITHUB_OUTPUT"

      ######################################################################
      # EXPORT ENTERPRISE AUDIT LOG
      ######################################################################

      - name: Export enterprise audit log
        shell: bash
        env:
          GH_HOST: ${{ steps.host.outputs.gh_host }}
        run: |
          set -euo pipefail

          SINCE=$(date -u -d "${LOOKBACK_DAYS} days ago" +%F)
          UNTIL=$(date -u +%F)

          OUTFILE="out/raw/enterprise-${ENTERPRISE_SLUG}-${SINCE}-to-${UNTIL}.json"

          echo "Exporting enterprise audit logs..."
          echo "Enterprise: ${ENTERPRISE_SLUG}"
          echo "Window: ${SINCE} -> ${UNTIL}"

          gh api \
            --hostname "${GH_HOST}" \
            -H "Accept: application/vnd.github+json" \
            "/enterprises/${ENTERPRISE_SLUG}/audit-log?include=all&per_page=100&phrase=created:${SINCE}..${UNTIL}" \
            > "${OUTFILE}"

          echo "Enterprise audit export completed: ${OUTFILE}"

      ######################################################################
      # EXPORT ORGANIZATION AUDIT LOGS
      ######################################################################

      - name: Export organization audit logs
        shell: bash
        env:
          GH_HOST: ${{ steps.host.outputs.gh_host }}
        run: |
          set -euo pipefail

          SINCE=$(date -u -d "${LOOKBACK_DAYS} days ago" +%F)
          UNTIL=$(date -u +%F)

          IFS=',' read -ra ORGS <<< "${{ steps.orgs.outputs.org_list }}"

          for ORG in "${ORGS[@]}"; do
            ORG_TRIMMED=$(echo "$ORG" | xargs)

            [ -z "$ORG_TRIMMED" ] && continue

            echo "Exporting org audit log: ${ORG_TRIMMED}"

            OUTFILE="out/raw/org-${ORG_TRIMMED}-${SINCE}-to-${UNTIL}.json"

            gh api \
              --hostname "${GH_HOST}" \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${ORG_TRIMMED}/audit-log?include=all&per_page=100&phrase=created:${SINCE}..${UNTIL}" \
              > "${OUTFILE}"

            echo "Org audit export completed: ${OUTFILE}"
          done

      ######################################################################
      # NORMALIZE DATA
      ######################################################################

      - name: Normalize audit data
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import glob
          import csv
          from pathlib import Path

          raw_files = sorted(glob.glob('out/raw/*.json'))

          summary_path = Path('out/summaries/au12-summary.csv')
          detail_path = Path('out/normalized/au12-normalized.jsonl')

          rows = []

          with detail_path.open('w', encoding='utf-8') as detail:
              for file in raw_files:
                  source = Path(file).stem

                  try:
                      data = json.loads(Path(file).read_text(encoding='utf-8'))
                  except Exception:
                      data = []

                  if isinstance(data, dict):
                      data = [data]

                  for item in data:
                      item['_source_file'] = source
                      detail.write(json.dumps(item, sort_keys=True) + '\n')

                      rows.append({
                          'source_file': source,
                          'action': item.get('action', ''),
                          'actor': item.get('actor', ''),
                          'org': item.get('org', ''),
                          'repo': item.get('repo', ''),
                          'created_at': item.get('created_at', '')
                      })

          summary_path.parent.mkdir(parents=True, exist_ok=True)

          with summary_path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=[
                      'source_file',
                      'action',
                      'actor',
                      'org',
                      'repo',
                      'created_at'
                  ]
              )
              writer.writeheader()
              writer.writerows(rows)

          print("Normalization complete.")
          PY

      ######################################################################
      # CHECKSUMS
      ######################################################################

      - name: Compute checksums
        shell: bash
        run: |
          set -euo pipefail

          (
            cd out
            find . -type f | sort | xargs sha256sum
          ) > out/summaries/sha256sums.txt

      ######################################################################
      # UPLOAD ARTIFACTS
      ######################################################################

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: au12-audit-exports
          path: out/
          retention-days: 90

      ######################################################################
      # OPTIONAL ARCHIVE INTEGRATION
      ######################################################################

      - name: Archive integration placeholder
        if: env.AUDIT_ARCHIVE_REPO != ''
        shell: bash
        run: |
          echo "Archive repository configured:"
          echo "${AUDIT_ARCHIVE_REPO}"
          echo "Integrate SIEM or evidence archive here."
