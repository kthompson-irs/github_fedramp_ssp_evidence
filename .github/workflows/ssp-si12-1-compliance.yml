name: FedRAMP SSP Compliance - SI-12(1)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  verify-and-export-si12-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run PII Scan and Generate Compliance JSON
        id: pii-scanner
        run: |
          echo "Scanning codebase for prohibited high-risk PII elements..."
          
          # Use grep -rn to catch both tracked and untracked workspace files
          # Exclude the .git directory to prevent scanning internal repository metadata
          SSN_MATCHES=$(grep -rnE '\b[0-9]{3}-[0-9]{2}-[0-9]{4}\b' . --exclude-dir=.git || true)
          
          # Initialize baseline variables
          COMPLIANCE_STATUS="COMPLIANT"
          VIOLATIONS_FOUND="false"
          
          if [ -n "$SSN_MATCHES" ]; then
            COMPLIANCE_STATUS="NON-COMPLIANT"
            VIOLATIONS_FOUND="true"
            echo "::error::Prohibited PII detected! Check the generated artifact for details."
          fi
          
          # Safely export matches to environment to avoid bash string-injection flaws during JSON packaging
          export SSN_MATCHES
          
          # Utilize jq natively to safely build a bulletproof JSON array out of raw text findings
          FINDINGS_ARRAY=$(echo "$SSN_MATCHES" | jq -R -s -c '
            split("\n") 
            | map(select(length > 0)) 
            | map(
                split(":") 
                | {
                    "file": .[0], 
                    "line": (.[1] | tonumber? // 0), 
                    "issue": "Potential SSN pattern exposed"
                  }
              )
          ')
          
          # Use jq to construct the final validated FedRAMP compliance JSON schema
          jq -n \
            --arg ctrl_id "SI-12(1)" \
            --arg ctrl_name "Limit Personally Identifiable Information Elements" \
            --arg fw "FedRAMP" \
            --arg lvl "Low" \
            --arg ts "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg repo "${{ github.repository }}" \
            --arg sha "${{ github.sha }}" \
            --arg status "${COMPLIANCE_STATUS}" \
            --argjson violations "${VIOLATIONS_FOUND}" \
            --argjson findings "${FINDINGS_ARRAY}" \
            '
            {
              "control_id": $ctrl_id,
              "control_name": $ctrl_name,
              "framework": $fw,
              "impact_level": $lvl,
              "assessment_timestamp": $ts,
              "repository": $repo,
              "commit_sha": $sha,
              "compliance_status": $status,
              "violations_detected": $violations,
              "allowed_pii_elements": [
                "user account usernames",
                "professional email addresses",
                "public SSH keys",
                "public GPG keys"
              ],
              "findings": $findings
            }
            ' > fedramp-si12-1-evidence.json
          
          # Export status safely to the environment for subsequent step logic
          echo "violations_detected=${VIOLATIONS_FOUND}" >> $GITHUB_ENV

      - name: Generate Markdown Job Summary
        run: |
          echo "### FedRAMP Control SI-12(1) Compliance Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.violations_detected }}" = "true" ]; then
            echo "**Status:** ❌ NON-COMPLIANT" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Prohibited PII leaked in workspace. Audit package updated with details." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ✅ COMPLIANT" >> $GITHUB_STEP_SUMMARY
            echo "No prohibited high-risk PII patterns found." >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Artifact Exported:** \`fedramp-si12-1-evidence.json\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Auditor Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedramp-si12-1-compliance-evidence
          path: fedramp-si12-1-evidence.json
          retention-days: 90

      - name: Enforce Build Failure on Non-Compliance
        run: |
          if [ "${{ env.violations_detected }}" = "true" ]; then
            echo "Failing pipeline due to FedRAMP SI-12(1) non-compliance."
            exit 1
          fi
