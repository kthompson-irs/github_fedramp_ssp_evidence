name: Collect IA-02(12) GitHub Enterprise Evidence

on:
  workflow_dispatch:
    inputs:
      enterprise_slug:
        description: GitHub Enterprise slug
        required: true
        default: internal-revenue-service
      lookback_days:
        description: Number of days of audit logs to collect
        required: true
        default: "30"

permissions:
  contents: read

jobs:
  collect-evidence:
    runs-on: ubuntu-latest

    env:
      ENTERPRISE_SLUG: ${{ inputs.enterprise_slug }}
      LOOKBACK_DAYS: ${{ inputs.lookback_days }}
      GH_ENTERPRISE_TOKEN: ${{ secrets.GH_ENTERPRISE_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate token
        run: |
          if [ -z "${GH_ENTERPRISE_TOKEN}" ]; then
            echo "Missing required secret: GH_ENTERPRISE_TOKEN"
            exit 1
          fi

      - name: Collect IA-02(12) evidence
        run: |
          python3 scripts/collect_ia_02_12_evidence.py \
            --enterprise "${ENTERPRISE_SLUG}" \
            --lookback-days "${LOOKBACK_DAYS}" \
            --output-dir evidence/IA-02-12

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: IA-02-12-${{ env.ENTERPRISE_SLUG }}-${{ github.run_id }}
          path: evidence/IA-02-12
          retention-days: 90
